name: Verificar ejercicio gRPC unario

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Generar archivos Protobuf
        run: python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. pagos.proto

      - name: Verificar sintaxis
        run: python -m compileall -q servidor.py cliente.py tests

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
